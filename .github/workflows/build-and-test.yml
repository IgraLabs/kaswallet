name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "false"
  # Use git CLI for fetching (required for SSH auth with private repos in isolated env)
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build-and-test:
    runs-on: [self-hosted, kaswallet]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust environment
        run: |
          CI_CACHE="/tmp/ci-cache/${{ runner.name }}"
          echo "CARGO_TARGET_DIR=${CI_CACHE}/cargo-target" >> $GITHUB_ENV
          echo "CARGO_HOME=${CI_CACHE}/cargo-home" >> $GITHUB_ENV
          echo "RUSTUP_HOME=${CI_CACHE}/rustup" >> $GITHUB_ENV
          echo "SCCACHE_DIR=${CI_CACHE}/sccache" >> $GITHUB_ENV
          mkdir -p "${CI_CACHE}/cargo-target" "${CI_CACHE}/cargo-home" "${CI_CACHE}/rustup" "${CI_CACHE}/sccache"
          echo "${CI_CACHE}/cargo-home/bin" >> $GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build
        run: cargo +stable build --locked --verbose

      - name: Run tests
        run: cargo +stable test --locked --verbose

      - name: Run integration tests (batch-send)
        # Spawns a real kaspad: single-threaded to avoid resource races
        # between concurrent nodes; explicit fd limit because kaspad's
        # fd-budget probe panics when the shell reports "unlimited".
        # Scoped to batch_send for now — the pre-existing p2pk/subnetwork
        # tests rely on fixed post-startup sleeps and flake on slow runners
        # ("wallet is not yet synced"); they need sync-polling before they
        # can gate PRs.
        run: bash -c 'ulimit -n 8192 && cargo +stable test --locked -p kaswallet-test-integration --features integration-tests batch_send --verbose -- --test-threads=1'
